name: Build animated DEADLINE profile banner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-deadline-banner.yml"
      - "scripts/generate_deadline_gif.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Create looping pink GIF
        run: python scripts/generate_deadline_gif.py
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/deadline-pink-animated.gif
          if ! git diff --cached --quiet; then
            git commit -m "Generate animated DEADLINE banner GIF"
            git push
          fi
